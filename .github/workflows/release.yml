name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.3.4"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean VoteDocxApp.spec

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item -LiteralPath "dist/QunzhongVote.exe" -Destination "dist/qunzhong-toupiao.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: qunzhong-toupiao-windows
          path: dist/qunzhong-toupiao.exe

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "v${{ inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "dist/qunzhong-toupiao.exe" --notes-file RELEASE_NOTES.md --title "群众投票 ${{ steps.release.outputs.tag }}"
