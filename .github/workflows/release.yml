name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.3.6"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build self-contained portable package
        shell: pwsh
        run: .\tools\build_portable.ps1 -SkipTests

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: qunzhong-toupiao-windows-portable
          path: dist/*-Windows-Portable.zip

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $version = python -c "from update_service import APP_VERSION; print(APP_VERSION)"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ inputs.version }}" -ne $version) {
              throw "Requested version ${{ inputs.version }} does not match APP_VERSION $version"
            }
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$version") {
              throw "Tag $tag does not match APP_VERSION $version"
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem -LiteralPath dist -Filter "*-Windows-Portable.zip" | Select-Object -First 1
          if (-not $asset) { throw "Portable ZIP not found." }
          gh release create "${{ steps.release.outputs.tag }}" "$($asset.FullName)" --notes-file RELEASE_NOTES.md --title "群众投票 ${{ steps.release.outputs.tag }}"
