name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean VoteDocxApp.spec

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item -LiteralPath "dist/QunzhongVote.exe" -Destination "dist/qunzhong-toupiao.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qunzhong-toupiao-windows
          path: dist/qunzhong-toupiao.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/qunzhong-toupiao.exe" --generate-notes --title "群众投票 ${{ github.ref_name }}"
